<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS Tools</title>
    <script src="./js/csinterface.js"></script>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    ::-webkit-scrollbar {
        width: 10px;
        background: #3c3c3c;
    }

    ::-webkit-scrollbar-track {
        background: #3c3c3c;
    }

    ::-webkit-scrollbar-thumb {
        background: #5e5e5e;
        border: 2px solid #3c3c3c;
        border-radius: 2px;
        min-height: 20px;
    }

    ::-webkit-scrollbar-thumb:hover {
        background: #717171;
    }

    ::-webkit-scrollbar-thumb:active {
        background: #888;
    }

    ::-webkit-scrollbar-button {
        display: none;
        height: 0;
        width: 0;
    }

    /* ★★★ 永远预留纵向滚动条的位置 ★★★
       现象：展开文件夹后内容变高 -> 纵向滚动条才出现 -> 它占掉 10px，
             于是里面的文件夹行/脚本行整体向左缩了一下，行宽在"展开"那一刻变了。
       做法：给根元素强制 overflow-y: scroll —— 不管内容多高，滚动条位置都一直占着
             （滚动条宽度在下面 ::-webkit-scrollbar 里定的是 10px），
             所以展开/收起文件夹时行宽完全不变。
             scrollbar-gutter: stable 是新引擎的等价写法，双保险。
       overflow-x: hidden 防止因为 1px 溢出冒出横向滚动条。 */
    html {
        overflow-x: hidden;
        overflow-y: scroll;
        scrollbar-gutter: stable;
    }

    body.app {
        background: #535353;
        padding: 6px 8px;
    }

    .btn-row {
        display: flex;
        align-items: center;
        width: 100%;
        margin-top: 4px;
    }

    .btn-row:first-child {
        margin-top: 0;
    }

    .btn-row.dragging {
        opacity: 0.4;
    }

    .ps-btn {
        flex: 1;
        min-width: 0;
        height: 22px;
        line-height: 20px;
        padding: 0 8px;
        background: #4a4a4a;
        color: #d1d1d1;
        font-family: "Adobe Clean", "Segoe UI", Tahoma, sans-serif;
        font-size: 11px;
        border: 1px solid #222;
        border-right: none;
        border-radius: 2px 0 0 2px;
        cursor: pointer;
        outline: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
        user-select: none;
    }

    .ps-btn:hover {
        background: #5a5a5a;
        color: #ffffff;
    }

    .ps-btn:active {
        background: #3a3a3a;
    }

    .drag-handle {
        flex-shrink: 0;
        width: 18px;
        height: 22px;
        background: #4a4a4a;
        border: 1px solid #222;
        border-radius: 0 2px 2px 0;
        cursor: grab;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .drag-handle::before {
        content: '';
        display: block;
        /* ★ 一列三个圆点竖排，尺寸已缩小（原来 15px 高，占按钮 22px 的 68%，太大）：
             width  4px  -> 只留一列
             height 12px -> 12 / 4 = 正好 3 个（占按钮高度的 55%）
             size   4×4  -> 点间距 4px，点半径 1.3px -> 相邻点之间约 1.4px 间隙
             repeat repeat-y -> 只往竖直方向重复 */
        width: 4px;
        height: 12px;
        background-image: radial-gradient(circle, #8a8a8a 1.3px, transparent 1.4px);
        background-size: 4px 4px;
        background-position: 0 0;
        background-repeat: repeat-y;
    }

    .drag-handle:hover {
        background: #5a5a5a;
    }

    .drag-handle:hover::before {
        /* ★ 几何必须和上面完全一致（只改颜色），否则 hover 时点数/位置会变 */
        background-image: radial-gradient(circle, #c0c0c0 1.3px, transparent 1.4px);
    }

    .drag-handle:active {
        cursor: grabbing;
        background: #3a3a3a;
    }

    .hotkey-tag {
        flex-shrink: 0;
        height: 22px;
        min-width: 22px;
        padding: 0 4px;
        background: #3a3a3a;
        border: 1px solid #222;
        border-left: none;
        border-right: none;
        color: #888;
        font-family: "Adobe Clean", "Segoe UI", Tahoma, sans-serif;
        font-size: 10px;
        line-height: 22px;
        text-align: center;
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
    }

    .hotkey-tag:hover {
        background: #444;
        color: #bbb;
    }

    .hotkey-tag.listening {
        background: #1a3a5c;
        color: #4da6ff;
        border-color: #4da6ff;
    }

    .drop-indicator {
        height: 2px;
        background: #4da6ff;
        border-radius: 1px;
        margin: 0;
        pointer-events: none;
        display: none;
    }

    .hint {
        color: #888;
        font-size: 11px;
        font-family: "Adobe Clean", "Segoe UI", Tahoma, sans-serif;
        padding: 6px 2px;
        line-height: 1.5;
    }

    .toolbar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        margin-bottom: 5px;
        gap: 2px;
    }






    .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        background: transparent;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        color: #888;
        font-size: 13px;
        line-height: 1;
        padding: 0;
        outline: none;
    }

    .icon-btn:hover {
        background: #5a5a5a;
        color: #ffffff;
    }

    .icon-btn:active {
        background: #3a3a3a;
    }
</style>

<body class="app">
    <div class="toolbar-sticky-slot" id="toolbar-slot">
        <div class="toolbar" id="toolbar">
        <button class="icon-btn" id="open-folder-btn" title="打开 scripts 文件夹"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px"><path d="M3 7.4A1.4 1.4 0 0 1 4.4 6h4.3c.5 0 .9.2 1.2.6l.9 1.1c.3.4.7.6 1.2.6h7.6A1.4 1.4 0 0 1 21 9.7v7.9A1.4 1.4 0 0 1 19.6 19H4.4A1.4 1.4 0 0 1 3 17.6V7.4z" fill="#6f6f6f" stroke="#bdbdbd" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
        <button class="icon-btn" id="reload-btn" title="刷新脚本列表">&#8635;</button>
        <button class="icon-btn" id="soft-reload-btn" title="热重载：从磁盘重新读 index.html 的样式和脚本（不关闭面板、不会白屏）">&#9851;</button>
    </div>
    </div>
    <div id="btn-container"></div>
    <style>
        /* ===== 面板修正（覆盖式，不动原样式） ===== */
        /* ★ 文件夹行的布局必须由【样式表】兜底：
           原来 display:flex / align-items / gap 全靠 head.style.cssText 的行内值撑着，
           一旦哪里把它清成 ''（曾经就有：folderDragEnd 里 head.style.display = ''），
           整行就退回 block、元素竖堆、压住下面的行。这里在 CSS 里再定一遍，双保险。 */
        .folder-row {
            width: 100%; box-sizing: border-box; color: #e8e8e8;
            display: flex; align-items: center; gap: 6px;
            height: 22px; padding: 0 0 0 6px; margin: 4px 0 0 0;
            border: 1px solid #222; border-radius: 2px;
        }
        .folder-row .sec-arrow { color: #e8e8e8 !important; }
        .folder-row .sec-label { color: #e8e8e8 !important; font-size: 11px !important; }
        .folder-row .sec-count { font-size: 10px !important; }
        /* 文件夹行背景加深，突出层级 */
        .folder-row { background: #2c2c2c !important; }
        /* 老 WebKit/CEF 需要这个才允许拖 div */
        .folder-row, .folder-row .drag-handle { -webkit-user-drag: element; }
        .folder-row:hover { background: #3a3a3a !important; }
        .sec-body { box-sizing: border-box; }
        /* 展开后第一条与文件夹行之间也要有和其它条目一样大的间距 */
        .sec-body .btn-row:first-child { margin-top: 4px !important; }
        /* 落点示意：与条目等大的矩形，并显示被拖脚本的名字（看起来就是"它会落在这里"）
           想改回细横线：height 改 2px、去掉 border、background 改 #4da6ff */
        .drop-indicator {
            height: 22px !important;
            margin: 4px 0 0 0 !important;
            background: rgba(77, 166, 255, 0.22) !important;
            border: 1px solid #4da6ff !important;
            border-radius: 2px !important;
            box-sizing: border-box !important;
            color: #dbeaff !important;
            font-family: "Adobe Clean", "Segoe UI", Tahoma, sans-serif !important;
            font-size: 11px !important;
            line-height: 20px !important;
            padding: 0 8px !important;
            overflow: hidden !important;
            white-space: nowrap !important;
            text-overflow: ellipsis !important;
            text-align: left !important;
        }
        /* 拖动时不显示原来的条目（只留蓝矩形）。
           ★ 不能用 display:none —— 拖动源被隐藏会让浏览器直接中止拖拽（所有行都拖不动）。
           用 opacity:0：视觉上看不到原条目，但拖拽不受影响。 */
        /* ===== 脚本执行中的状态提示 =====
           evalScript 的回调在 PS 侧跑完时才触发，所以点击后给这一行上色、
           回调里再撤掉 —— 一眼就能看出"正在执行"还是"已经跑完"。 */
        @keyframes psjsxRunningPulse {
            0%   { background: #1f4e8a !important; }
            50%  { background: #3a86dc !important; }
            100% { background: #1f4e8a !important; }
        }
        .btn-row.running .ps-btn {
            background: #1f4e8a !important;
            color: #eaf3ff !important;
            animation: psjsxRunningPulse 1.1s ease-in-out infinite !important;
            cursor: progress !important;
        }
        @keyframes psjsxErrorFlash {
            0%   { background: #8f2a2a !important; }
            50%  { background: #c23a3a !important; }
            100% { background: #8f2a2a !important; }
        }
        .btn-row.run-error .ps-btn {
            background: #8f2a2a !important;
            color: #ffecec !important;
            animation: psjsxErrorFlash 0.35s ease-in-out 4 !important;
        }

        /* ===== 拖到文件夹【内部】时：分界线 + 上/下半区高亮 =====
           中线以上 = 放到该文件夹【上方】；中线以下 = 放到该文件夹【下方】。
           高亮层是绝对定位的覆盖层，所以 .folder-sec 要有 position:relative。 */
        .folder-sec { position: relative; }
        .folder-half-hl {
            position: absolute; left: 0; right: 0;
            pointer-events: none;
            background: rgba(77, 166, 255, 0.20);
            border: 0 solid #4da6ff;
            border-radius: 2px;
            z-index: 5;
        }
        .folder-half-hl.top    { top: 0;   bottom: 50%; border-bottom-width: 2px; }
        .folder-half-hl.bottom { top: 50%; bottom: 0;   border-top-width: 2px; }
        .btn-row.dragging { opacity: 0 !important; }
        /* 拖拽把手：已恢复原样（原来的 .drag-handle 样式生效，此处不再覆盖） */
        /* ===== 顶部工具栏常驻（滚动脚本列表时不被滚走）=====
           为什么用 fixed 而不是 sticky：旧版 CEF 对 position:sticky 支持不稳定，
           fixed 相对面板视口定位，最可靠。工具栏自己占位（body 用 padding-top 让开），
           所以内容不会被盖住。 */
        /* ★ 把 sticky 挂在外面这个「占位条」上：
           可见的工具栏自己始终是 static，
           所以滚动时它不会发生任何位移（不会有 "微偏移"）。
           占位条保证内容从工具栏下方开始排，不会钻到图标下面。
           旧 CEF 不支持 sticky 时会自动降级为普通布局（= 以前的行为）。 */
        .toolbar-sticky-slot {
            position: sticky !important;
            top: 0 !important;
            z-index: 1000 !important;
        }
        /* ★ body 上边距归 0：否则占位条在文档里是从 6px 处开始的，
           滚到顶部时工具栏在 6px、往下滚就跳到 0px，看起来就是"位置往下移"。
           间距改由工具栏自己的 padding-top 提供。 */
        body.app { padding-top: 0 !important; }
        .toolbar {
            position: static !important;
            margin-bottom: 0 !important;
            background: #535353 !important;
            /* 上 6px：图标不贴死面板上沿（这一层是包含在占位条里的，不会引起位移）
               下 4px：与列表的间隙；左右 8px：与 body 的左右边距对齐 */
            padding: 6px 8px 4px 8px !important;
        }
    </style>
    <script>
        var fs = require('fs');
        var path = require('path');
        var shell = require('child_process');
        var scriptsDir = path.join(__dirname, 'scripts');
        var ORDER_KEY = 'ps_jsx_loader_order';
        var HOTKEY_KEY = 'ps_jsx_loader_hotkeys';

        function getSavedHotkeys() {
            try { return JSON.parse(localStorage.getItem(HOTKEY_KEY)) || {}; } catch(e) { return {}; }
        }

        function saveHotkeys(map) {
            localStorage.setItem(HOTKEY_KEY, JSON.stringify(map));
        }

        document.getElementById('open-folder-btn').addEventListener('click', function () {
            shell.exec('explorer "' + scriptsDir + '"');
        });

        document.getElementById('reload-btn').addEventListener('click', function () {
            loadButtons();
        });



        document.getElementById('soft-reload-btn').addEventListener('click', function () {
            softReloadPanel();
        });

        /* ★★★ 重载面板 = "就地重建"，绝对不用 location 导航 ★★★
           原来的写法是 location.href = base + '?r=时间戳'：
           在 CEP 里给 file:// 地址加 query 会让页面打不开 ——
           面板直接变成【空白】，而且这个 ⟳ 按钮也跟着没了，
           只能重启 PS 才能恢复（非常坑）。
           现在改成：清掉所有临时状态 + 重新扫盘 + 重建列表。
           效果等同于刷新，但页面不离开，永远不会白屏。

           ⚠️ 这样刷不到 index.html 本身的改动（HTML 已经解析过了）：
              改过 index.html 之后，请用：

        /* ★★★ 热重载：从磁盘重新读 index.html，把 <style> 和 inline <script> 就地替换 ★★★
           用来加载"改过 index.html 之后"的新样式/新逻辑，而且【不导航、不关闭面板、不会白屏】。
           原理：把文件读回来，抠出所有 <style> 块和内联 <script> 块，
                 换掉页面上的样式，再注入一段新 <script> —— 它最后一行就是 loadButtons()，
                 所以列表会自己重建。
           注意：只同步【样式 + 脚本】。如果改的是 <body> 里的 HTML 结构（标签、新元素），
                 这里不会重建 DOM —— 那种情况仍需重开面板。 */
        function softReloadPanel() {
            var ok = false, err = '';
            try {
                /* 1) 读磁盘上的 index.html */
                var htmlPath = path.join(__dirname, 'index.html');
                var raw = fs.readFileSync(htmlPath, 'utf8');

                /* 2) 抠出所有 <style> 块 */
                var cssBlocks = [], m = null;
                var reStyle = /<style[^>]*>([\s\S]*?)<\/style>/gi;
                while ((m = reStyle.exec(raw)) !== null) { cssBlocks.push(m[1]); }

                /* 3) 抠出内联 <script>（跳过带 src 的，比如 csinterface.js） */
                var jsBlocks = [];
                var reScript = /<script(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)<\/script>/gi;
                while ((m = reScript.exec(raw)) !== null) { jsBlocks.push(m[1]); }
                if (!jsBlocks.length) { throw new Error('index.html 里没找到内联 <script>'); }

                /* 4) 先把工具栏按钮上的旧监听摘掉。
                      否则重跑脚本会再绑一遍 -> 点一次触发两次（热重载自己也会叠）。 */
                var ids = ['open-folder-btn', 'reload-btn', 'soft-reload-btn'];
                for (var bi = 0; bi < ids.length; bi++) {
                    var oldBtn = document.getElementById(ids[bi]);
                    if (oldBtn && oldBtn.parentNode) {
                        var fresh = oldBtn.cloneNode(true);
                        oldBtn.parentNode.replaceChild(fresh, oldBtn);
                    }
                }

                /* 5) 换样式：删掉页面上所有 <style>，把新的按顺序插进 <head> */
                var olds = document.querySelectorAll('style');
                for (var si = 0; si < olds.length; si++) {
                    if (olds[si].parentNode) olds[si].parentNode.removeChild(olds[si]);
                }
                for (var ci = 0; ci < cssBlocks.length; ci++) {
                    var st = document.createElement('style');
                    st.textContent = cssBlocks[ci];
                    document.head.appendChild(st);
                }

                /* 6) 清空列表容器：新脚本末尾的 loadButtons() 会重建它 */
                var box = document.getElementById('btn-container');
                if (box) box.innerHTML = '';

                /* 7) 注入新的内联脚本（脚本元素插入后会自动执行，且在全局作用域） */
                var sc = document.createElement('script');
                sc.textContent = jsBlocks.join("\n");
                document.body.appendChild(sc);

                ok = true;
            } catch (eSL) {
                ok = false;
                err = (eSL && eSL.message) ? eSL.message : String(eSL);
            }
            /* 反馈：成功 → ✔；失败 → ✖ 并把原因写进 title */
            try {
                var b2 = document.getElementById('soft-reload-btn');
                if (b2) {
                    var oldText = b2.innerHTML, oldTitle = b2.title;
                    b2.innerHTML = ok ? '&#10004;' : '&#10008;';
                    if (!ok) b2.title = '热重载失败: ' + err;
                    setTimeout(function () {
                        try { b2.innerHTML = oldText; b2.title = oldTitle; } catch (e5) {}
                    }, 1200);
                }
            } catch (e6) {}
            if (!ok) { try { console.log('[热重载失败] ' + err); } catch (e7) {} }
            return ok;
        }





        function getSavedOrder() {
            try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || []; } catch(e) { return []; }
        }

        function saveOrder(files) {
            localStorage.setItem(ORDER_KEY, JSON.stringify(files));
        }

        function applyOrder(files) {
            var saved = getSavedOrder();
            var ordered = saved.filter(function(f) { return files.indexOf(f) !== -1; });
            files.forEach(function(f) { if (ordered.indexOf(f) === -1) ordered.push(f); });
            return ordered;
        }

        // ================= 树状列举（按文件夹折叠，仿 PS 图层面板） =================
        var FOLD_KEY = 'psjsx.folders';
        var FOLDER_ORDER_KEY = 'psjsx.folderOrder';


        function getFolderOrder() {
            try { return JSON.parse(localStorage.getItem(FOLDER_ORDER_KEY)) || []; } catch (e) { return []; }
        }
        function setFolderOrder(list) {
            try { localStorage.setItem(FOLDER_ORDER_KEY, JSON.stringify(list)); } catch (e) {}
        }
        function savedFolderIndex(name) {
            var o = getFolderOrder();
            for (var i = 0; i < o.length; i++) { if (o[i] === name) return i; }
            return 9999;
        }
        // 从任意节点往上找"文件夹标题行"
        function nearestFolderRow(el) {
            var n = el;
            while (n && n.nodeType === 1) {
                if (n.classList && n.classList.contains('folder-row')) return n;
                n = n.parentNode;
            }
            return null;
        }
        function folderNameOfRow(folderRow) {
            return folderRow ? (folderRow.getAttribute('data-folder') || '') : '';
        }

        function getFoldState() {
            try { return JSON.parse(localStorage.getItem(FOLD_KEY) || '{}'); } catch (e) { return {}; }
        }
        function setFoldState(st) {
            try { localStorage.setItem(FOLD_KEY, JSON.stringify(st)); } catch (e) {}
        }

        // 递归列举脚本：文件夹在前（按拼音排序），返回相对路径，例如 "批量流程/ps 01 xxx.jsx"
        function listScripts(dir) {
            var out = [], dirs = [], loose = [];
            var entries;
            try {
                entries = fs.readdirSync(dir, { withFileTypes: true });
            } catch (e) {
                try {
                    entries = fs.readdirSync(dir).map(function (n) {
                        return { name: n, isDirectory: function () { return false; } };
                    });
                } catch (e2) { return out; }
            }
            entries.forEach(function (en) {
                var nm = en.name;
                if (!nm || nm.charAt(0) === '.' || nm === 'node_modules') return;
                /* 面板不显示「参考 / 备份」这类目录：
                   · 以 _ 开头（_废弃备份 等）
                   · 以 参考 开头（参考_经验 / 参考_多选与选区）
                   这些是文档和调试材料，不是可运行的日常工具。 */
                if (nm.charAt(0) === '_') return;
                if (nm.indexOf('参考') === 0) return;
                var isDir = false;
                try { isDir = (en.isDirectory && en.isDirectory()); } catch (e3) {}
                if (isDir) { dirs.push(nm); return; }
                if (/\.jsx$/i.test(nm)) loose.push(nm);
            });
            dirs.sort(function (x, y) {
                var ox = savedFolderIndex(x), oy = savedFolderIndex(y);
                if (ox !== oy) return ox - oy;
                return x.localeCompare(y, 'zh');
            });
            loose.sort(function (x, y) { return x.localeCompare(y, 'zh'); });
            dirs.forEach(function (d) {
